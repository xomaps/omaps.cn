{{ define "main" }}
  <main id="main">
    <article class="article">
      <div class="container article-narrow">
        <nav class="breadcrumb" aria-label="面包屑">
          <a href="/">首页</a> <span>/</span> <a href="/insights/">行业洞察</a> <span>/</span> <em>{{ .Params.category }}</em>
        </nav>
        <h1 class="article-title">{{ .Title }}</h1>
        <div class="article-meta">
          <span class="tag">{{ .Params.category }}</span>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
          <span>信朴 Xomaps</span>
        </div>
        <div class="article-body">
{{ .Content }}
        </div>

        {{ partial "article-cta.html" . }}

{{ partial "article-related.html" . }}
      </div>
    </article>
  </main>
{{ end }}
